<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File & Folder Searcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>File & Folder Search</h1>
        
        <div class="controls">
            <div class="input-group">
                <button id="selectFolderBtn">Select Folder or Drive</button>
                <input type="text" id="folderPath" readonly placeholder="No location selected">
            </div>
            
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Enter file or folder name to search...">
                <button id="searchBtn" disabled>Search</button>
                <button id="findDuplicatesBtn" disabled>Find Duplicates</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>

            <div class="input-group">
                <button id="selectExcludeBtn" style="white-space: nowrap;">Add Excluded Folder</button>
                <input type="text" id="excludeInput" placeholder="Exclude folders (comma separated, e.g. node_modules, .git)">
            </div>
        </div>

        <div class="status" id="statusArea">Ready. Waiting for input.</div>

        <div class="result-actions" style="margin-bottom: 10px; display: flex; gap: 10px;">
            <input type="text" id="filterInput" placeholder="Filter displayed results by name..." style="flex-grow: 1; box-sizing: border-box;">
            <button id="batchTrashAllBtn" style="display: none; background-color: var(--accent); color: #11111b; white-space: nowrap;">Trash All Older Duplicates</button>
        </div>
        
        <div class="results-container">
            <ul id="resultsList"></ul>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
