<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File & Folder Searcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>File & Folder Search</h1>
        
        <div class="controls">
            <div class="input-group">
                <button id="selectFolderBtn">Select Folder or Drive</button>
                <input type="text" id="folderPath" readonly placeholder="No location selected">
            </div>
            
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Enter file or folder name to search...">
                <button id="searchBtn" disabled>Search</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>
        </div>

        <div class="status" id="statusArea">Ready. Waiting for input.</div>
        
        <div class="results-container">
            <ul id="resultsList"></ul>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
